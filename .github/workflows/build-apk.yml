name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle*
            apps/android/**/gradle-wrapper.properties
            apps/android/gradle/libs.versions.toml

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: ${{ runner.os }}-android-sdk-v1-cmdline-14742923-platform-37.0-build-tools-36.0.0
          restore-keys: |
            ${{ runner.os }}-android-sdk-v1-

      - name: Setup Android SDK cmdline-tools
        run: |
          set -euo pipefail
          CMDLINE_TOOLS_VERSION="14742923"
          ARCHIVE="commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          URL="https://dl.google.com/android/repository/${ARCHIVE}"

          if [ ! -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
            curl -fsSL "$URL" -o "/tmp/${ARCHIVE}"
            rm -rf "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
            unzip -q "/tmp/${ARCHIVE}" -d "${ANDROID_SDK_ROOT}/cmdline-tools"
            mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          fi

          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (Play flavor)
        if: inputs.build_type == 'debug'
        working-directory: apps/android
        run: ./gradlew --no-daemon --build-cache :app:assemblePlayDebug

      - name: Build release APK (Play flavor)
        if: inputs.build_type == 'release'
        working-directory: apps/android
        env:
          OPENCLAW_ANDROID_STORE_FILE: ${{ secrets.OPENCLAW_ANDROID_STORE_FILE }}
          OPENCLAW_ANDROID_STORE_PASSWORD: ${{ secrets.OPENCLAW_ANDROID_STORE_PASSWORD }}
          OPENCLAW_ANDROID_KEY_ALIAS: ${{ secrets.OPENCLAW_ANDROID_KEY_ALIAS }}
          OPENCLAW_ANDROID_KEY_PASSWORD: ${{ secrets.OPENCLAW_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${OPENCLAW_ANDROID_STORE_FILE}" ]; then
            echo "$OPENCLAW_ANDROID_STORE_FILE" | base64 -d > keystore.jks
            echo "OPENCLAW_ANDROID_STORE_FILE=$(pwd)/keystore.jks" >> "$GITHUB_ENV"
          fi
          ./gradlew --no-daemon --build-cache :app:assemblePlayRelease

      - name: Rename APK
        run: |
          if [ -f apps/android/app/build/outputs/apk/play/debug/app-play-debug.apk ]; then
            cp apps/android/app/build/outputs/apk/play/debug/app-play-debug.apk apps/android/app/build/outputs/apk/play/debug/openclaw-android.apk
            echo "APK_PATH=apps/android/app/build/outputs/apk/play/debug/openclaw-android.apk" >> "$GITHUB_ENV"
          elif [ -f apps/android/app/build/outputs/apk/play/release/app-play-release.apk ]; then
            cp apps/android/app/build/outputs/apk/play/release/app-play-release.apk apps/android/app/build/outputs/apk/play/release/openclaw-android.apk
            echo "APK_PATH=apps/android/app/build/outputs/apk/play/release/openclaw-android.apk" >> "$GITHUB_ENV"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-android-${{ inputs.build_type }}
          path: apps/android/app/build/outputs/apk/play/${{ inputs.build_type }}/openclaw-android.apk
          if-no-files-found: error

      - name: Generate changelog
        if: inputs.build_type == 'release' && github.ref_type == 'branch'
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --reverse)
          else
            CHANGES=$(git log --pretty=format:"- %s" --reverse -20)
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$CHANGES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: inputs.build_type == 'release' && github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "OpenClaw Android v${{ github.run_number }} (${{ github.ref_name }})"
          body: |
            🦞 **OpenClaw for Android**

            📱 Install the APK on any ARM64 Android 7.0+ device. No root required.

            ### Changes
            ${{ steps.changelog.outputs.notes }}

            ---
            Branch: ${{ github.ref_name }}
            Built from commit ${{ github.sha }}
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
